name: poc-ldap-provisionamento

services:
  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    restart: unless-stopped
    command: ["--copy-service"]

    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
      LDAP_TLS: "false"

    ports:
      - "${LDAP_PORT}:389"
    volumes:
      - ldap_database:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/50-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapwhoami -x -H ldap://localhost:389 -D 'cn=admin,dc=empresa,dc=test' -w \"$${LDAP_ADMIN_PASSWORD}\" >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - poc_network

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped

    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"

    ports:
      - "${PHPLDAPADMIN_PORT}:80"

    depends_on:
      openldap:
        condition: service_healthy

    networks:
      - poc_network

  postgres:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - poc_network

  superset-init:
    build:
      context: ./superset
      dockerfile: Dockerfile

    image: poc-superset-ldap:5.0.0
    restart: "no"

    env_file:
      - .env

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath

    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home

    command:
      - /bin/sh
      - -c
      - |
        /app/.venv/bin/superset db upgrade &&
        /app/.venv/bin/superset init

    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy

    networks:
      - poc_network

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile

    image: poc-superset-ldap:5.0.0
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath

    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home

    ports:
      - "${SUPERSET_PORT}:8088"

    command:
      - /app/docker/entrypoints/run-server.sh

    depends_on:
      superset-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)\""
        ]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 30s

    networks:
      - poc_network

volumes:
  ldap_database:
  ldap_config:
  postgres_data:
  superset_home:

networks:
  poc_network:
    driver: bridge
